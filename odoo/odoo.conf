[options]
; Where custom modules live inside the image (Odoo's own modules are always included).
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Applies to every Odoo command (the server, first-time setup, updates).
; Odoo's default memory cap is too small for PyTorch, which maps a large
; library file into memory just to be loaded; 0 means no cap.
limit_memory_hard = 0
limit_memory_soft = 0
; Reading a page takes seconds and a whole day's PDF queues many of them, so
; background work is allowed far longer than the 2-minute default.
limit_time_real = 1800
limit_time_real_cron = 1800
limit_time_cpu = 1800
without_demo = True
